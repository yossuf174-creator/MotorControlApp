<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard</title>
  <style>
    :root{
      --bg:#edf4ff;
      --card:#ffffff;
      --primary:#1f68d7;
      --primary-dark:#154ea9;
      --text:#15263d;
      --muted:#60738e;
      --success:#17a673;
      --danger:#e55353;
      --warning:#f4b740;
      --shadow:0 12px 32px rgba(21, 78, 169, 0.12);
      --overlay: rgba(15, 30, 54, 0.54);
    }

    *{ box-sizing:border-box; }
    html, body{
      margin:0;
      width:100%;
      height:100%;
      font-family:Tahoma, Arial, sans-serif;
      background:linear-gradient(180deg, #edf4ff 0%, #dfeeff 100%);
      color:var(--text);
    }

    body{
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding:18px;
      position:relative;
      overflow:hidden;
    }

    .app{
      width:min(100%, 1000px);
      min-height:calc(100vh - 36px);
      display:flex;
      flex-direction:column;
      gap:16px;
      position:relative;
      z-index:1;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      background:rgba(255,255,255,0.88);
      border-radius:18px;
      padding:14px 16px;
      border:1px solid rgba(31,104,215,0.1);
      box-shadow:var(--shadow);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:700;
    }

    .logo{
      width:42px; height:42px;
      border-radius:12px;
      background:linear-gradient(135deg, var(--primary), #4aa0ff);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:18px;
      box-shadow:0 8px 18px rgba(31,104,215,0.25);
    }

    .search-wrap{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .search-box{
      display:flex;
      align-items:center;
      background:#f1f6ff;
      border:1px solid rgba(31,104,215,0.12);
      border-radius:12px;
      overflow:hidden;
      min-width:260px;
    }

    input[type="search"]{
      border:none;
      outline:none;
      background:transparent;
      padding:12px 14px;
      font-size:15px;
      color:var(--text);
      width:100%;
    }

    button{
      border:none;
      border-radius:12px;
      padding:11px 14px;
      font-weight:700;
      cursor:pointer;
      transition:0.2s ease;
    }

    button:hover{ transform:translateY(-1px); }
    button:active{ transform:translateY(0); }

    .primary{
      background:linear-gradient(180deg, var(--primary), #215fd0);
      color:#fff;
      box-shadow:0 8px 18px rgba(31,104,215,0.22);
    }

    .secondary{
      background:#fff;
      color:var(--primary-dark);
      border:1px solid rgba(31,104,215,0.12);
    }

    .accent{
      background:linear-gradient(180deg, #ffb703, #f59e0b);
      color:#1f1f1f;
    }

    .card{
      background:rgba(255,255,255,0.88);
      border:1px solid rgba(31,104,215,0.08);
      border-radius:22px;
      box-shadow:var(--shadow);
      padding:18px;
    }

    .hero{
      display:grid;
      grid-template-columns:1.6fr 1fr;
      gap:16px;
    }

    .hero-main{
      min-height:250px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      position:relative;
      overflow:hidden;
      background:linear-gradient(135deg, rgba(255,255,255,0.9), rgba(236,245,255,0.9));
    }

    .hero-main::after{
      content:"";
      position:absolute;
      inset:auto -50px -50px auto;
      width:220px;
      height:220px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(79,147,255,0.2), rgba(79,147,255,0));
    }

    .city{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      position:relative;
      z-index:1;
    }

    .city-name{
      font-size:2rem;
      font-weight:800;
      margin:0;
    }

    .city-meta{
      color:var(--muted);
      font-size:0.95rem;
      margin-top:6px;
    }

    .temp-row{
      display:flex;
      align-items:center;
      gap:18px;
      margin-top:10px;
      position:relative;
      z-index:1;
    }

    .weather-icon{
      font-size:4.4rem;
      filter:drop-shadow(0 8px 18px rgba(31,104,215,0.12));
    }

    .temp{
      font-size:4rem;
      line-height:1;
      font-weight:900;
      letter-spacing:-2px;
    }

    .condition{
      font-size:1.1rem;
      color:var(--muted);
      margin-top:6px;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:12px;
      margin-top:18px;
      position:relative;
      z-index:1;
    }

    .stat{
      background:rgba(255,255,255,0.7);
      border-radius:14px;
      padding:12px 14px;
      border:1px solid rgba(31,104,215,0.08);
    }

    .stat-label{
      font-size:12px;
      color:var(--muted);
      margin-bottom:5px;
    }

    .stat-value{
      font-size:1.2rem;
      font-weight:800;
    }

    .side-panel{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .mini-box{
      background:linear-gradient(180deg, rgba(255,255,255,0.9), rgba(244,249,255,1));
      border:1px solid rgba(31,104,215,0.08);
      border-radius:16px;
      padding:14px;
    }

    .mini-title{
      font-size:12px;
      color:var(--muted);
      margin-bottom:6px;
      font-weight:700;
    }

    .mini-value{
      font-size:2rem;
      font-weight:900;
      margin:0;
    }

    .meta-row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:12px;
    }

    .pill{
      background:#f1f6ff;
      color:var(--primary-dark);
      border:1px solid rgba(31,104,215,0.12);
      padding:7px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
    }

    .forecast{
      display:grid;
      grid-template-columns:repeat(5, minmax(0,1fr));
      gap:12px;
      margin-top:4px;
    }

    .day-box{
      background:linear-gradient(180deg, rgba(255,255,255,0.9), rgba(244,249,255,0.98));
      border:1px solid rgba(31,104,215,0.08);
      border-radius:16px;
      padding:12px 10px;
      text-align:center;
    }

    .day-name{
      font-size:12px;
      color:var(--muted);
      margin-bottom:5px;
    }

    .day-ico{
      font-size:28px;
      margin:6px 0;
    }

    .day-temp{
      font-weight:800;
      font-size:1.1rem;
    }

    .status-error{
      display:none;
      padding:12px 14px;
      border-radius:12px;
      border:1px solid rgba(229, 83, 83, 0.25);
      background:rgba(229, 83, 83, 0.08);
      color:var(--danger);
      font-weight:700;
    }

    .quick-actions {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:4px;
    }

    .chip {
      background:rgba(31,104,215,0.06);
      border:1px solid rgba(31,104,215,0.12);
      color:var(--primary-dark);
      padding:8px 10px;
      border-radius:999px;
      font-weight:700;
      font-size:12px;
      cursor:pointer;
    }

    .splash {
      position:fixed;
      inset:0;
      z-index:999;
      background:linear-gradient(180deg, rgba(11,22,38,0.78), rgba(31,104,215,0.70));
      display:flex;
      align-items:center;
      justify-content:center;
      transition:opacity 0.8s ease, visibility 0.8s ease;
    }

    .splash.hidden {
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .splash-card {
      background:rgba(255,255,255,0.12);
      border:1px solid rgba(255,255,255,0.22);
      border-radius:24px;
      padding:26px 28px;
      text-align:center;
      color:#fff;
      box-shadow:0 18px 40px rgba(7, 24, 52, 0.22);
    }

    .splash-logo {
      width:72px; height:72px;
      margin:0 auto 14px;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg, #fff, #dbeaff);
      color:var(--primary);
      font-size:34px;
      box-shadow:0 12px 30px rgba(255,255,255,0.18);
    }

    .spinner {
      width:38px; height:38px;
      margin:12px auto 0;
      border:4px solid rgba(255,255,255,0.3);
      border-top:4px solid #fff;
      border-radius:50%;
      animation:spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 780px){
      .hero{
        grid-template-columns:1fr;
      }
      .forecast{
        grid-template-columns:repeat(2, minmax(0,1fr));
      }
      .topbar{
        flex-direction:column;
        align-items:stretch;
      }
      .search-wrap{
        justify-content:stretch;
      }
      .search-box{
        width:100%;
      }
    }
  </style>
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-card">
      <div class="splash-logo">☁</div>
      <div style="font-size:1.2rem; font-weight:800; margin-bottom:8px;">Weather Dashboard</div>
      <div style="opacity:0.85;">جارٍ تجهيز البيانات...</div>
      <div class="spinner"></div>
    </div>
  </div>

  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo">☁</div>
        <div>
          <div style="font-size:1.1rem;">Weather Dashboard</div>
          <div style="font-size:0.75rem; color:var(--muted);">Live forecast</div>
        </div>
      </div>

      <div class="search-wrap">
        <div class="search-box">
          <input id="cityInput" type="search" placeholder="اكتب المدينة..." />
        </div>
        <button id="searchBtn" class="primary">بحث</button>
        <button id="locBtn" class="secondary">موقعي</button>
        <button id="refreshBtn" class="secondary">تحديث</button>
        <button id="unitBtn" class="secondary">°C</button>
      </div>
    </div>

    <div class="quick-actions">
      <button class="chip" data-city="القاهرة">القاهرة</button>
      <button class="chip" data-city="الرياض">الرياض</button>
      <button class="chip" data-city="دبي">دبي</button>
      <button class="chip" data-city="لندن">لندن</button>
    </div>

    <div id="errorBox" class="status-error"></div>

    <div class="hero">
      <div class="card hero-main">
        <div class="city">
          <div>
            <div id="cityName" class="city-name">--</div>
            <div id="cityMeta" class="city-meta">--</div>
          </div>
          <button id="reloadBtn" class="secondary">إعادة</button>
        </div>

        <div class="temp-row">
          <div id="weatherIcon" class="weather-icon">☀️</div>
          <div>
            <div id="temperature" class="temp">--°</div>
            <div id="condition" class="condition">--</div>
          </div>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="stat-label">الرياح</div>
            <div id="wind" class="stat-value">--</div>
          </div>
          <div class="stat">
            <div class="stat-label">الرطوبة</div>
            <div id="humidity" class="stat-value">--</div>
          </div>
          <div class="stat">
            <div class="stat-label">الضغط</div>
            <div id="pressure" class="stat-value">--</div>
          </div>
          <div class="stat">
            <div class="stat-label">الأمطار</div>
            <div id="precip" class="stat-value">--</div>
          </div>
        </div>
      </div>

      <div class="side-panel">
        <div class="card mini-box">
          <div class="mini-title">حالة الطقس</div>
          <p id="statusText" class="mini-value">--</p>
          <div class="meta-row">
            <span id="sunrise" class="pill">شروق --</span>
            <span id="sunset" class="pill">غروب --</span>
          </div>
        </div>

        <div class="card mini-box">
          <div class="mini-title">معلومات إضافية</div>
          <div class="meta-row">
            <span id="uv" class="pill">UV --</span>
            <span id="visibility" class="pill">رؤية --</span>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="font-size:1rem; font-weight:800; margin-bottom:12px;">توقعات 5 أيام</div>
      <div id="forecast" class="forecast"></div>
    </div>
  </div>

  <script>
    const splash = document.getElementById('splash');
    const weatherCodes = {
      0: ["صافي", "☀️"],
      1: ["غائم قليلًا", "🌤️"],
      2: ["غائم جزئيًا", "⛅"],
      3: ["غائم", "☁️"],
      45: ["ضباب", "🌫️"],
      48: ["ضباب متجمد", "🌫️"],
      51: ["رذاذ خفيف", "🌦️"],
      53: ["رذاذ متوسط", "🌦️"],
      55: ["رذاذ كثيف", "🌧️"],
      56: ["رذاذ متجمد خفيف", "🌧️❄️"],
      57: ["رذاذ متجمد كثيف", "🌧️❄️"],
      61: ["مطر خفيف", "🌦️"],
      63: ["مطر متوسط", "🌧️"],
      65: ["مطر شديد", "⛈️"],
      66: ["مطر متجمد خفيف", "🌧️❄️"],
      67: ["مطر متجمد شديد", "🌧️❄️"],
      71: ["ثلج خفيف", "🌨️"],
      73: ["ثلج متوسط", "🌨️"],
      75: ["ثلج شديد", "❄️"],
      77: ["حبيبات ثلج", "❄️"],
      80: ["زخات خفيفة", "🌦️"],
      81: ["زخات متوسطة", "🌧️"],
      82: ["زخات شديدة", "⛈️"],
      85: ["زخات ثلجية خفيفة", "🌨️"],
      86: ["زخات ثلجية شديدة", "❄️"],
      95: ["عاصفة رعدية", "⛈️"],
      96: ["عاصفة رعدية مع برد خفيف", "⛈️"],
      99: ["عاصفة رعدية مع برد شديد", "⛈️"]
    };

    const cityInput = document.getElementById("cityInput");
    const searchBtn = document.getElementById("searchBtn");
    const locBtn = document.getElementById("locBtn");
    const unitBtn = document.getElementById("unitBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const reloadBtn = document.getElementById("reloadBtn");
    const errorBox = document.getElementById("errorBox");

    const cityName = document.getElementById("cityName");
    const cityMeta = document.getElementById("cityMeta");
    const weatherIcon = document.getElementById("weatherIcon");
    const temperature = document.getElementById("temperature");
    const condition = document.getElementById("condition");
    const wind = document.getElementById("wind");
    const humidity = document.getElementById("humidity");
    const pressure = document.getElementById("pressure");
    const precip = document.getElementById("precip");
    const statusText = document.getElementById("statusText");
    const sunrise = document.getElementById("sunrise");
    const sunset = document.getElementById("sunset");
    const uv = document.getElementById("uv");
    const visibility = document.getElementById("visibility");
    const forecast = document.getElementById("forecast");

    let unit = localStorage.getItem("weatherUnit") || "C";
    let currentCoords = null;
    let currentLabel = "القاهرة";

    unitBtn.textContent = unit === "C" ? "°C" : "°F";

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = "block";
    }

    function hideError() {
      errorBox.style.display = "none";
      errorBox.textContent = "";
    }

    function hideSplash() {
      setTimeout(() => {
        splash.classList.add('hidden');
      }, 700);
    }

    function cToF(c) {
      return (c * 9 / 5) + 32;
    }

    function formatTemp(value) {
      const v = Number(value);
      if (unit === "C") return `${Math.round(v)}°C`;
      return `${Math.round(cToF(v))}°F`;
    }

    function formatTime(str) {
      if (!str) return "--";
      const d = new Date(str);
      return d.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" });
    }

    function formatDay(str) {
      if (!str) return "--";
      const d = new Date(str);
      return d.toLocaleDateString("ar-EG", { weekday: "short" });
    }

    function getWeatherIcon(code) {
      return (weatherCodes[code] || ["غير معروف", "❔"])[1];
    }

    function getWeatherText(code) {
      return (weatherCodes[code] || ["غير معروف", "❔"])[0];
    }

    async function geocodeCity(name) {
      const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=en&format=json`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("فشل في جلب المدينة");
      const data = await res.json();
      if (!data.results || data.results.length === 0) throw new Error("لم يتم العثور على المدينة");
      const item = data.results[0];
      return {
        lat: item.latitude,
        lon: item.longitude,
        name: item.name,
        country: item.country,
        admin1: item.admin1 || ""
      };
    }

    async function fetchWeather(lat, lon, label) {
      hideError();

      const url =
        `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
        `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,pressure_msl,visibility` +
        `&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max` +
        `&timezone=auto&forecast_days=5`;

      const res = await fetch(url);
      if (!res.ok) throw new Error("فشل في جلب بيانات الطقس");

      const data = await res.json();
      const current = data.current;
      const daily = data.daily;

      if (!current || !daily) {
        throw new Error("لا توجد بيانات طقس");
      }

      const weatherCode = Number(current.weather_code);
      const weather = getWeatherText(weatherCode);
      const icon = getWeatherIcon(weatherCode);

      weatherIcon.textContent = icon;
      temperature.textContent = formatTemp(current.temperature_2m);
      condition.textContent = weather;
      wind.textContent = `${Math.round(current.wind_speed_10m)} كم/س`;
      humidity.textContent = `${Math.round(current.relative_humidity_2m)}%`;
      pressure.textContent = `${Math.round(current.pressure_msl)} hPa`;
      precip.textContent = `${Math.round(current.precipitation ?? 0)} mm`;

      cityName.textContent = label || "المدينة";
      cityMeta.textContent = new Date().toLocaleString("ar-EG", {
        weekday: "long",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });

      statusText.textContent = weather;
      sunrise.textContent = `شروق ${formatTime(daily.sunrise?.[0])}`;
      sunset.textContent = `غروب ${formatTime(daily.sunset?.[0])}`;
      uv.textContent = `UV ${Number(daily.uv_index_max?.[0] ?? 0).toFixed(1)}`;
      visibility.textContent = `رؤية ${Math.round(current.visibility / 1000)} كم`;

      renderForecast(daily);
      currentCoords = { lat, lon };
      currentLabel = label;
    }

    function renderForecast(daily) {
      forecast.innerHTML = "";

      for (let i = 0; i < 5; i++) {
        const code = Number(daily.weather_code?.[i] ?? 0);
        const max = Number(daily.temperature_2m_max?.[i] ?? 0);
        const min = Number(daily.temperature_2m_min?.[i] ?? 0);

        const box = document.createElement("div");
        box.className = "day-box";

        box.innerHTML = `
          <div class="day-name">${formatDay(daily.time?.[i])}</div>
          <div class="day-ico">${getWeatherIcon(code)}</div>
          <div class="day-temp">${formatTemp(max)}</div>
          <div style="color:var(--muted); font-size:12px;">${formatTemp(min)}</div>
        `;

        forecast.appendChild(box);
      }
    }

    async function searchCity() {
      const value = cityInput.value.trim();
      if (!value) {
        showError("يرجى إدخال اسم المدينة");
        return;
      }
      try {
        const place = await geocodeCity(value);
        await fetchWeather(place.lat, place.lon, `${place.name}${place.admin1 ? ", " + place.admin1 : ""}`);
      } catch (error) {
        showError(error.message || "حدث خطأ أثناء البحث");
      }
    }

    async function useCurrentLocation() {
      if (!navigator.geolocation) {
        showError("الموقع غير مدعوم في هذا الجهاز");
        return;
      }

      navigator.geolocation.getCurrentPosition(async (pos) => {
        try {
          await fetchWeather(pos.coords.latitude, pos.coords.longitude, "موقعك الحالي");
        } catch (error) {
          showError(error.message || "فشل في الحصول على الطقس الحالي");
        }
      }, () => {
        showError("تعذر الوصول إلى موقعك. جرّب البحث يدويًا.");
      });
    }

    document.querySelectorAll('.chip').forEach((chip) => {
      chip.addEventListener('click', async () => {
        const city = chip.dataset.city;
        if (!city) return;
        cityInput.value = city;
        await searchCity();
      });
    });

    searchBtn.addEventListener("click", searchCity);
    cityInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") searchCity();
    });

    locBtn.addEventListener("click", useCurrentLocation);
    refreshBtn.addEventListener("click", async () => {
      if (currentCoords) {
        await fetchWeather(currentCoords.lat, currentCoords.lon, currentLabel);
      } else {
        await fetchWeather(30.0444, 31.2357, "القاهرة");
      }
    });
    reloadBtn.addEventListener("click", async () => {
      if (currentCoords) {
        await fetchWeather(currentCoords.lat, currentCoords.lon, currentLabel);
      } else {
        await fetchWeather(30.0444, 31.2357, "القاهرة");
      }
    });

    unitBtn.addEventListener("click", () => {
      unit = unit === "C" ? "F" : "C";
      localStorage.setItem("weatherUnit", unit);
      unitBtn.textContent = unit === "C" ? "°C" : "°F";
      if (currentCoords) {
        fetchWeather(currentCoords.lat, currentCoords.lon, currentLabel);
      }
    });

    fetchWeather(30.0444, 31.2357, "القاهرة")
      .then(() => hideSplash())
      .catch(err => {
        showError(err.message || "حدث خطأ في التحميل الأولي");
        hideSplash();
      });
  </script>
</body>
</html>
