<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>محاكي المحرك</title>
  <style>
    body{margin:0;font-family:Tahoma,Arial;background:#0b1013;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh}
    .box{width:92%;max-width:720px;background:#eaf2f6;color:#0b2030;padding:16px;border-radius:12px;text-align:center}
    button{padding:12px 18px;margin:8px;border-radius:8px;border:none;font-weight:700;cursor:pointer}
    .start{background:#35c96c;color:#003}
    .stop{background:#e73d3c;color:#fff}
    .status{margin-top:12px;font-weight:800}
  </style>
</head>
<body>
  <div class="box">
    <h2>محاكي المحرك</h2>
    <p>واجهة مبسطة تعمل داخل التطبيق بدون اتصال بالإنترنت.</p>
    <div>
      <button class="start" id="startBtn">تشغيل</button>
      <button class="stop" id="stopBtn">إيقاف</button>
    </div>
    <div class="status" id="status">الحالة: متوقف</div>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const status = document.getElementById('status');
    startBtn.addEventListener('click', ()=> {
      status.textContent = 'الحالة: الدائرة تعمل';
      document.body.style.background = '#04281a';
    });
    stopBtn.addEventListener('click', ()=> {
      status.textContent = 'الحالة: متوقف';
      document.body.style.background = '#0b1013';
    });
  </script>
</body>
</html>
